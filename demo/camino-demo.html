<title>Camino · Demo para rectores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: una columna móvil primero; barra fija arriba (aviso + progreso), una pantalla visible a la vez, una acción principal al final. */
:root{
  --bosque:#2F3A22; --olivo:#6B7A3A; --olivo-texto:#56632C; --brote:#CBE29A; --crema:#FFFDF0; --sendero:#C8733A;
  --papel:#FFFFFF; --linea:#E4E2CC; --tenue:#4E5440; --suave:#F4F3E2;
  --ok:#10B981; --mod:#0284C7; --alerta:#F59E0B; --riesgo:#EF4444;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--crema);color:var(--bosque);font-family:var(--body);font-size:1rem;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,6vw,2.8rem)}
h2{font-size:clamp(1.5rem,4.5vw,2rem)}
h3{font-size:1.2rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sendero);outline-offset:2px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bosque);color:var(--crema)}
.aviso{background:var(--sendero);color:var(--bosque);font-weight:700;text-align:center;padding:6px 16px;font-size:1rem}
.barra{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1.35rem;margin-right:auto}
.marca svg{flex:none}
.acomp{font-family:var(--body);font-weight:400;font-size:1rem;color:var(--brote)}
.navbtn{background:transparent;border:1px solid rgba(255,253,240,.45);color:var(--crema);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.navbtn:hover{background:rgba(255,253,240,.12)}
.navbtn:disabled{opacity:.4;cursor:default}
.progreso{max-width:880px;margin:0 auto;padding:0 16px 12px;display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.progreso div{height:6px;border-radius:3px;background:rgba(255,253,240,.2)}
.progreso div.hecho{background:var(--brote)}
.progreso div.actual{background:var(--sendero)}
.etapa{max-width:880px;margin:0 auto;padding:0 16px 10px;color:var(--brote);font-size:1rem}

main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:28px 40px}
section.pantalla{display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:1rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--olivo-texto)}
.lead{font-size:1.15rem;color:var(--tenue);max-width:62ch}
.tenue{color:var(--tenue)}

.card{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:999px;border:0;background:var(--bosque);color:var(--crema);font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center}
.btn:hover{background:#3E4B2E}
.btn.sec{background:transparent;color:var(--bosque);border:2px solid var(--bosque)}
.btn.sec:hover{background:var(--suave)}
.btn.chico{min-height:44px;padding:8px 16px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.accion{display:flex;flex-direction:column;gap:10px;align-items:stretch}
@media (min-width:600px){.accion{flex-direction:row;align-items:center}}
.enlace{background:none;border:0;padding:0;color:var(--olivo-texto);text-decoration:underline;cursor:pointer;font-size:1rem;min-height:44px}

.pasos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));counter-reset:p}
.paso{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brote);color:var(--bosque);font-weight:700;display:grid;place-items:center}

.hero{background:var(--bosque);color:var(--crema);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--brote)}
.hero .lead{color:#E6E9D6}
.hero svg.fondo{position:absolute;right:-80px;bottom:-80px;opacity:.08;pointer-events:none}
.marca-txt{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
.hero .marca-txt{color:var(--brote);font-size:1.1em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--brote);color:var(--bosque);border-radius:999px;padding:4px 12px;font-weight:500}

.precio{font-family:var(--display);font-size:2.4rem;font-weight:600;font-variant-numeric:tabular-nums}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.check li{display:flex;gap:10px;align-items:flex-start}
ul.check li::before{content:"";flex:none;width:18px;height:18px;margin-top:4px;border-radius:50%;background:var(--brote);box-shadow:inset 0 0 0 5px var(--olivo)}

label{font-weight:700;display:block}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.ayuda{font-weight:400;color:var(--tenue);font-size:1rem}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #B9B79E;border-radius:10px;background:var(--papel)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--olivo);outline:none;box-shadow:0 0 0 3px var(--brote)}
.error{color:#9A2B2B;font-weight:500}
.opciones{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.opcion{display:flex;gap:10px;align-items:center;border:1.5px solid #B9B79E;border-radius:12px;padding:12px 14px;background:var(--papel);cursor:pointer;min-height:52px;font-weight:500}
.opcion:has(input:checked){border-color:var(--bosque);background:var(--suave);box-shadow:inset 0 0 0 1px var(--bosque)}
.opcion input{width:20px;height:20px;accent-color:var(--bosque);flex:none}
.logo-prev{width:88px;height:88px;border-radius:14px;border:1.5px dashed #B9B79E;display:grid;place-items:center;background:var(--papel);overflow:hidden;flex:none;color:var(--tenue);text-align:center;font-size:.9rem}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.subpasos{display:flex;gap:8px;flex-wrap:wrap}
.subpasos span{padding:6px 12px;border-radius:999px;background:var(--suave);color:var(--tenue)}
.subpasos span.on{background:var(--bosque);color:var(--crema)}
.grupo-fila{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:8px;align-items:end}
.quitar{min-height:48px;border-radius:10px;border:1.5px solid #B9B79E;background:var(--papel);cursor:pointer}

.recibo{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:20px;display:grid;gap:8px}
.recibo .r{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--linea);padding-bottom:8px;font-variant-numeric:tabular-nums}
.recibo .r:last-child{border:0}
.sello{display:inline-block;border:2px solid var(--olivo);color:var(--olivo-texto);border-radius:8px;padding:2px 10px;font-weight:700;transform:rotate(-3deg);width:max-content}

.colegio{display:flex;gap:14px;align-items:center}
.colegio .logo{width:64px;height:64px;border-radius:12px;background:var(--papel);border:1px solid var(--linea);overflow:hidden;flex:none}
.colegio .logo img{width:100%;height:100%;object-fit:contain}
.lista-ver{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lista-ver li{display:flex;gap:12px;align-items:center;color:var(--tenue);transition:color .3s}
.lista-ver li .caja{width:26px;height:26px;border-radius:8px;border:2px solid #B9B79E;display:grid;place-items:center;flex:none;transition:all .3s}
.lista-ver li.ok{color:var(--bosque)}
.lista-ver li.ok .caja{background:var(--olivo);border-color:var(--olivo)}
.lista-ver li.ok .caja::after{content:"";width:10px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.activo{display:inline-flex;align-items:center;gap:8px;background:var(--brote);color:var(--bosque);border-radius:999px;padding:6px 14px;font-weight:700}
.activo::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--olivo)}

.qr{width:136px;height:136px;background:#fff;padding:4px;border-radius:8px;border:1px solid var(--linea);display:grid;place-items:center;text-align:center;font-size:.85rem;flex:none}
.qr img,.qr canvas{width:128px!important;height:128px!important}
.link-box{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--suave);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:.95rem}
.contador{font-family:var(--display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.barra-meta{height:10px;border-radius:5px;background:var(--suave);overflow:hidden}
.barra-meta div{height:100%;background:var(--olivo);transition:width .5s}
.pre{white-space:pre-wrap;background:var(--suave);border-radius:10px;padding:14px;font-size:1rem}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}

/* Tablero */
.tab-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.marcas{display:flex;gap:8px;flex-wrap:wrap}
.tag{border-radius:999px;padding:4px 12px;font-weight:700;font-size:1rem}
.tag.ejemplo{background:var(--sendero);color:var(--bosque)}
.tag.agregado{background:var(--suave);color:var(--bosque);border:1px solid var(--linea)}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtro{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--bosque);background:transparent;cursor:pointer;font-weight:500}
.filtro[aria-pressed=true]{background:var(--bosque);color:var(--crema)}
.isce{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.anillo{position:relative;width:150px;height:150px;flex:none}
.anillo .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.anillo .v b{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.sem{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.sem i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.indice .barra-i{height:12px;border-radius:6px;background:var(--suave);overflow:hidden}
.indice .barra-i div{height:100%;border-radius:6px}
.indice .valor{font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.banner{border-radius:12px;padding:14px 16px;background:#FEF3C7;border:1.5px solid var(--alerta);color:#5C3A00;font-weight:500}
.protegido{border-radius:12px;padding:14px 16px;background:var(--suave);border:1.5px dashed #B9B79E}
.reco{border-top:1px solid var(--linea);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.reco:first-of-type{border-top:0;padding-top:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--linea)}
th{font-size:1rem;color:var(--tenue);font-weight:700}
.tabla-wrap{overflow-x:auto}
.formula{font-size:1rem;color:var(--tenue)}
.informe{background:#fff;border:1px solid var(--linea);border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(47,58,34,.08)}

/* Encuesta de estudiante (vista previa) */
.telefono{max-width:400px;width:100%;margin:0 auto;background:var(--crema);border:10px solid var(--bosque);border-radius:32px;padding:20px 16px;display:flex;flex-direction:column;gap:16px;min-height:540px}
.opt-escala{display:flex;flex-direction:column;gap:8px}
.opt-escala button{min-height:52px;border-radius:12px;border:1.5px solid #B9B79E;background:var(--papel);text-align:left;padding:10px 14px;cursor:pointer;font-weight:500}
.opt-escala button[aria-pressed=true]{background:var(--bosque);color:var(--crema);border-color:var(--bosque)}
.mini-prog{height:6px;border-radius:3px;background:var(--suave);overflow:hidden}
.mini-prog div{height:100%;background:var(--olivo)}

.estrellas{display:flex;gap:6px;flex-wrap:wrap}
.estrellas label{font-weight:500}
.escala10{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.escala10 label{display:grid;place-items:center;min-height:44px;border:1.5px solid #B9B79E;border-radius:8px;background:var(--papel);cursor:pointer;font-weight:500}
.escala10 label:has(input:checked){background:var(--bosque);color:var(--crema);border-color:var(--bosque)}
.escala10 input{position:absolute;opacity:0;pointer-events:none}
@media (max-width:420px){.escala10{grid-template-columns:repeat(6,minmax(0,1fr))}}

.pagando{display:flex;align-items:center;gap:12px;font-weight:700}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--brote);border-top-color:var(--bosque);animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.powered{display:flex;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:16px 28px;border-top:1px solid var(--linea);color:var(--tenue);font-size:1rem}
.vs-logo{font-weight:700;color:var(--bosque);display:inline-flex;align-items:center}
.vs-logo img{height:22px;width:auto;mix-blend-mode:multiply}
.pie{font-size:1rem;color:var(--tenue);text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="aviso" role="note">Demostración: no se cobra ni se guardan datos reales</div>
  <div class="barra">

  <div class="progreso" id="progreso" aria-hidden="true"></div>
  <div class="etapa" id="etapa" aria-live="polite"></div>
</header>

function copiar(texto,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1500)};
  try{navigator.clipboard.writeText(texto).then(ok,()=>fallback())}catch(e){fallback()}

}

/* ---------- Motor de cálculo (igual al PRD v2.0) ---------- */
function V(r,pol){return pol==='d'?(r-1)/3*100:(4-r)/3*100}
function metricas(resp){ // resp: array de 18 valores 1–4
  const acc={IAA:[],IPSP:[],ICERE:[]};let fake=0;
  PREG.forEach((p,i)=>{if(p[3]==='c'){if(resp[i]===4)fake++}else acc[p[1]].push(V(resp[i],p[3]))});
  const m=k=>acc[k].reduce((a,b)=>a+b,0)/acc[k].length;
  const IAA=m('IAA'),IPSP=m('IPSP'),ICERE=m('ICERE');
  return {IAA,IPSP,ICERE,ISCE:.35*IAA+.35*IPSP+.30*ICERE,flag:fake>=2};
}
function semaforo(v){
  if(v>=80)return{t:'Óptimo',c:'var(--ok)'};
  if(v>=60)return{t:'Moderado',c:'var(--mod)'};
  if(v>=40)return{t:'Alerta crítica',c:'var(--alerta)'};
  return{t:'Riesgo institucional',c:'var(--riesgo)'};
}
// Generador con semilla: mismas respuestas ficticias en cada demo
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function gauss(r){return (r()+r()+r()-1.5)/0.5}
const SESGOS=[{IAA:.49,IPSP:.40,ICERE:.66},{IAA:.58,IPSP:.50,ICERE:.54},{IAA:.64,IPSP:.57,ICERE:.71},{IAA:.44,IPSP:.47,ICERE:.60}];
function meta(g,i){return Math.min(+g.n,Math.max(1,Math.round(+g.n*(i%2?0.8:0.867))))}
function estudiantesGrupo(g,i){
  const r=rng(1000+i*97),b=SESGOS[i%SESGOS.length],tot=meta(g,i),out=[];
  for(let s=0;s<tot;s++){
    const w={IAA:b.IAA+gauss(r)*.12,IPSP:b.IPSP+gauss(r)*.12,ICERE:b.ICERE+gauss(r)*.12};
    const resp=PREG.map(p=>{
      if(p[3]==='c')return r()<.14?4:1+Math.floor(r()*3);
      const nivel=Math.max(0,Math.min(3,Math.round((w[p[1]]+gauss(r)*.18)*3)));
      return p[3]==='d'?nivel+1:4-nivel;
    });
    out.push(metricas(resp));
  }
  return out;
}
function respuestasActuales(){
  return gruposValidos().map((g,i)=>{
    const todos=estudiantesGrupo(g,i);
    let n=0;
    if(S.sim===1)n=i===0?todos.length:Math.min(3,todos.length);
    if(S.sim>=2)n=todos.length;
    return {g,meta:meta(g,i),est:todos.slice(0,n)};
  });
}
function agregado(est){
  const n=est.length,prom=k=>est.reduce((a,e)=>a+e[k],0)/n;
  const IAA=prom('IAA'),IPSP=prom('IPSP'),ICERE=prom('ICERE');
  const flags=est.filter(e=>e.flag).length;
  return {n,IAA,IPSP,ICERE,ISCE:.35*IAA+.35*IPSP+.30*ICERE,autent:100-flags/n*100,flagPct:flags/n*100};
}

    if(S.sub===3){if(!gruposValidos().length||S.grupos.some(g=>(g.nombre&&!(+g.n>0))||(!g.nombre&&g.n)))e.grupos='Escriba cada curso con su número de estudiantes.';if(!S.consent)e.consent='Elija cómo avisará a los padres.';if(!S.autoriza)e.aut='Debe aceptar la autorización de datos para activar el colegio.'}
    S.errores=e;return !Object.keys(e).length};
  $('#fIns').onsubmit=ev=>{ev.preventDefault();guardar();if(!validar()){render();const f=document.querySelector('.error');f&&f.scrollIntoView({block:'center'});return}
    if(S.sub<3){S.sub++;S.errores={};render();window.scrollTo({top:0})}else{S.grupos=gruposValidos();ir(6)}};
  const sa=$('#subAtras');if(sa)sa.onclick=()=>{guardar();S.sub--;S.errores={};render()};
  const lg=$('#iLogo');if(lg)lg.onchange=()=>{const f=lg.files[0];if(!f)return;if(!/image\/(png|jpeg)/.test(f.type)){S.errores.iLogo='El logo debe ser PNG o JPG.';guardar();render();return}
    const rd=new FileReader();rd.onload=()=>{guardar();S.colegio.logo=rd.result;delete S.errores.iLogo;render()};rd.readAsDataURL(f)};
  const ag=$('#addGrupo');if(ag)ag.onclick=()=>{guardar();S.grupos.push({nombre:'',n:''});render();const u=document.querySelectorAll('[data-k=nombre]');u[u.length-1].focus()};
  document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{guardar();S.grupos.splice(+b.dataset.quitar,1);render()});
  $('#ejemplo').onclick=()=>{guardar();
    S.colegio={nombre:'Colegio Ejemplo San Martín',logo:logoEjemplo(),ciudad:'Barranquilla, Atlántico',nit:'',cal:'A'};
    S.resp={nombre:S.resp.nombre||'Ana Pérez, Rectora',correo:S.resp.correo||'rectoria@ejemplo.edu.co',cel:'300 000 0000',orientador:'Laura Gómez, psicóloga (oficina de bienestar)'};
    S.grupos=[{nombre:'9°A',n:'30'},{nombre:'9°B',n:'30'}];S.consent='circular';S.autoriza=true;S.errores={};render()};
};
function logoEjemplo(){const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');
  x.fillStyle='#1F4E79';x.beginPath();x.moveTo(80,8);x.lineTo(148,36);x.lineTo(140,110);x.quadraticCurveTo(80,156,80,156);x.quadraticCurveTo(80,156,20,110);x.lineTo(12,36);x.closePath();x.fill();
  x.fillStyle='#FFFFFF';x.font='bold 54px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('SM',80,82);return c.toDataURL('image/png')}
enlazar[6]=()=>{
  const li=document.querySelectorAll('#verif li');
  li.forEach((l,i)=>timers.push(setTimeout(()=>l.classList.add('ok'),500+i*550)));
  timers.push(setTimeout(()=>{$('#estadoActivo').hidden=false;$('#irPanel').disabled=false},500+li.length*550));
};
enlazar[7]=()=>{
  document.querySelectorAll('[data-qr]').forEach(el=>{
    if(window.QRCode){try{new QRCode(el,{text:el.dataset.qr,width:128,height:128,colorDark:'#2F3A22',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR no disponible'}}
    else el.textContent='QR no disponible sin conexión';
  });
  document.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=()=>copiar(b.dataset.copiar,b));
  $('#copiarWa').onclick=e=>copiar(mensajeWa(),e.currentTarget);
  const sim=$('#simular');if(sim)sim.onclick=()=>{const antes=respuestasActuales().reduce((a,x)=>a+x.est.length,0);S.sim++;const rs=respuestasActuales(),despues=rs.reduce((a,x)=>a+x.est.length,0),metaT=rs.reduce((a,x)=>a+x.meta,0);
    const y=window.scrollY;render();window.scrollTo({top:y});
    const cont=$('#contador');let n=antes;const paso=Math.max(1,Math.ceil((despues-antes)/25));
    const tick=()=>{n=Math.min(despues,n+paso);cont.textContent=`${n} / ${metaT}`;if(n<despues)timers.push(setTimeout(tick,40))};tick()};
  $('#verEnc').onclick=()=>{S.enc={fase:'asent',grado:'',i:0,r:Array(18).fill(0)};renderEnc();$('#encuesta').scrollIntoView({behavior:'smooth',block:'start'})};
  renderEnc();
};
enlazar[8]=()=>{
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;const y=window.scrollY;render();window.scrollTo({top:y})});
  const bi=$('#btnInforme');if(bi)bi.onclick=()=>{S.verInforme=!S.verInforme;const y=window.scrollY;render();window.scrollTo({top:y})};
};
enlazar[9]=()=>{
  const f=$('#fCierre');
  if(f)f.onsubmit=ev=>{ev.preventDefault();const v=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value||'';
    S.cierre={entendio:v('entendio'),sirve:v('sirve'),pagaria:v('pagaria'),nps:v('nps'),comentario:$('#coment').value.trim()};
    if(!S.cierre.entendio||!S.cierre.sirve||!S.cierre.pagaria||!S.cierre.nps){S.errores={cierre:'Responda las 4 preguntas para enviar.'};render();return}
    S.enviado=true;S.errores={};render();window.scrollTo({top:0})};
  const cc=$('#copiarCierre');if(cc)cc.onclick=()=>copiar(resumenCierre(),cc);
};
